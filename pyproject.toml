# SPDX-License-Identifier: MIT
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcenginecd-python"
version = "0.2.0"
description = "Readable, pure-Python PC Engine CD-ROM2 / Super CD-ROM2: pcengine-python plus the CD unit, System Card and SCSI drive, through the base board's sockets"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.20); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
# The base board, pinned by git revision on GitHub (https://github.com/alewman/pcengine-python).
# Nothing is copied from it. 03ac699 = 3318027 plus the crop of a display that starts before
# the row (a small HDS; the row kept 1365 // divider dots instead of growing).
# 3318027 = the base board's clean rewrite of 2026-11-19 (a new VDC
# line machine: display origin 8 dots earlier in the row, vblank_dots default -16, scroll latch,
# sprite budget from the manual; old save states do not load; core huc6280-python 6ce348e, its
# own clean rewrite). Both on GitHub since 2026-11-20 (installed from local clones before that,
# docs/restart.md "Repin to the clean base board"). Over 4c32f26 = pcengine-python v0.2.0 (core huc6280-python v0.4.0), over
# bc9b976 = pcengine-python v0.1.0 (core huc6280-python v0.3.0), over
# c469e28 = b914413 plus the picture scripts' pad input and save
# states (pcengine_python.state, which this package registers itself with). b914413 = a0114c5 plus the repin of huc6280-python to 9c47c98 (its
# issue 0004: decimal ADC/SBC with an invalid BCD digit follow Mednafen's formulas). a0114c5 = fc923c5 (issue 0002: the board calls PortDevice.catch_up;
# issue 0003: the board mixes audio_sources, Board.take_audio) plus the repin of huc6280-python to
# v0.2.0 (f31b630). Repin deliberately and rerun the tests and the boot runs (docs/m7-record.md).
dependencies = [
    # 2a3768f: pcengine-python's history reset 647de63 (2026-11-21, 03ac699's board, SPDX lines
    # since) plus its repin of huc6280-python to 03d1247 (5cff9e8 with 6502-python repinned).
    "pcengine-python @ git+https://github.com/alewman/pcengine-python@2a3768f02ca0f2d467a5e095844f0421a3903d0a",
]

[project.urls]
Homepage = "https://github.com/alewman/pcenginecd-python"
Repository = "https://github.com/alewman/pcenginecd-python"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pcenginecd_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "tests/runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pcenginecd_python"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not slow'"
pythonpath = ["src", "tests"]
markers = ["slow: boots a disc for many emulated seconds (pytest -m slow)"]
